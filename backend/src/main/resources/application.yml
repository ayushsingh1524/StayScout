spring:
  application:
    name: stayscout
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/stayscout
    username: ${DB_USER:stay}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  auth:
    login-attempt-limit: 10
    registration-attempt-limit: 5
